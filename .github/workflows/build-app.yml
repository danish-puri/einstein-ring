name: Build Mac app

# Every change gets a downloadable build; publishing a public release remains explicit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Apple's arm64 runner can validate the actual distributed executable and HEVC assets.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          # bash checks only its first script argument; validate each script separately.
          for script in build-app.sh render-video.sh wallpaper.sh tests/verify-app.sh; do
            bash -n "$script"
          done
      - name: Download and verify the rendered wallpaper
        # Pin the source release and its hashes so CI never silently packages different media.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0 --repo danish-puri/einstein-ring --pattern cosmos.mp4 --pattern cosmos.png
          shasum -a 256 -c app/media.sha256
      - name: Build app and disk image
        run: ./build-app.sh
      - name: Validate app and failure handling
        run: ./tests/verify-app.sh
      - name: Save installable downloads
        uses: actions/upload-artifact@v4
        with:
          name: Einstein-Ring-macOS-Apple-silicon
          path: dist/
          if-no-files-found: error
          retention-days: 14
